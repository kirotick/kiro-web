.indian-bg{background-color:var(--ind-cream)}
.ind-divider{height:24px;background-image:var(--ind-divider);background-repeat:repeat-x;background-position:center;background-size:48px 12px;background-color:var(--ind-cream);border-top:3px solid var(--ind-saffron);border-bottom:1px solid #E7D6BA}
.ind-chip{background:#FFFFFF;border:1px solid #E7D6BA;border-radius:999px;padding:6px 14px;font-weight:700;color:#7A2E2E;font-size:14px}

html{scroll-behavior:smooth}
a{color:#0B4A58}a:hover{color:#073540}
@keyframes kiroUp{from{transform:translateY(28px)}to{transform:none}}
/* Scroll-in effect. Works on phones, laptops and previews; a safety timer shows anything the observer misses. */
.js .reveal{opacity:0;transform:translateY(34px) scale(.985);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.js .reveal.in{opacity:1;transform:none}
.js .reveal.in:hover{transform:translateY(-2px)}
@keyframes kiroBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes kiroSpin{to{transform:rotate(360deg)}}
.tilt{transition:transform .35s ease,box-shadow .35s ease}
.tilt:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 26px 50px rgba(11,74,88,0.18)}
@media (prefers-reduced-motion: reduce){.js .reveal{opacity:1;transform:none;transition:none}.tilt:hover{transform:none}}
@media (prefers-reduced-motion: reduce){.reveal{animation:none}html{scroll-behavior:auto}}
/* compact-mobile */@media (max-width:640px){section{padding-top:44px !important;padding-bottom:44px !important;gap:18px !important}section[aria-labelledby="cover-title"]{min-height:auto !important;padding-top:28px !important;padding-bottom:40px !important}header{height:auto !important}header nav a{font-size:14px !important}header a[href="app/"]{padding:8px 12px !important;font-size:13px !important}h1{font-size:34px !important;line-height:1.08 !important}h2{font-size:26px !important;line-height:1.12 !important}h3{font-size:19px !important}p{font-size:16px !important}a[style*="padding: 16px 32px"],a[style*="padding:16px 32px"]{padding:12px 20px !important}.ind-divider{height:14px !important}.ink-mural{height:90px !important}}/* /compact-mobile */</style>
