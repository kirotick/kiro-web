.ink-mural{height:clamp(120px,16vw,210px);background-image:var(--ink-mural);background-repeat:repeat-x;background-size:auto 100%;background-position:center bottom}
.ink-mural.top{margin-top:8px}
.indian-bg{background-color:var(--ind-cream)}
.ind-divider{height:24px;background-image:var(--ind-divider);background-repeat:repeat-x;background-position:center;background-size:48px 12px;background-color:var(--ind-cream);border-top:3px solid var(--ind-saffron);border-bottom:1px solid #E7D6BA}
.ind-chip{background:#FFFFFF;border:1px solid #E7D6BA;border-radius:999px;padding:6px 14px;font-weight:700;color:#7A2E2E;font-size:14px}

a{color:#0B4A58}
a:hover{color:#073540}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #F4A51C;outline-offset:2px}
.field-in:focus{outline:none;border-color:#0B4A58 !important;box-shadow:0 0 0 3px rgba(244,165,28,0.35)}
@keyframes kiroOverlay{0%,88%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes kiroPop{0%{opacity:0;transform:scale(.3) rotate(-40deg)}60%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes kiroLetter{0%{opacity:0;transform:translateY(48px) scale(.7);filter:blur(8px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes kiroLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kiroFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kiroOrb{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes kiroRing{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
.intro{animation:kiroOverlay 6s ease both}
.pop{animation:kiroPop .7s cubic-bezier(.2,.8,.2,1) both}
.ltr{display:inline-block;animation:kiroLetter .6s cubic-bezier(.2,.8,.2,1) both}
.sweep{transform-origin:left;animation:kiroLine .6s ease-out both}
.fadein{animation:kiroFade .5s ease-out both}
.orb{animation:kiroOrb .5s cubic-bezier(.2,.8,.2,1) both}
.ring{animation:kiroRing 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.intro{display:none !important}}
@media (max-width: 880px){.login-grid{grid-template-columns:1fr !important}.login-side{display:none !important}}
/* compact-mobile */@media (max-width:640px){section{padding-top:44px !important;padding-bottom:44px !important;gap:18px !important}section[aria-labelledby="cover-title"]{min-height:auto !important;padding-top:28px !important;padding-bottom:40px !important}header{height:auto !important}header nav a{font-size:14px !important}header a[href="app/"]{padding:8px 12px !important;font-size:13px !important}h1{font-size:34px !important;line-height:1.08 !important}h2{font-size:26px !important;line-height:1.12 !important}h3{font-size:19px !important}p{font-size:16px !important}a[style*="padding: 16px 32px"],a[style*="padding:16px 32px"]{padding:12px 20px !important}.ind-divider{height:14px !important}.ink-mural{height:90px !important}}/* /compact-mobile */</style>
