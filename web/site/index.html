.stamp{background:radial-gradient(circle,#12262C 5px,transparent 5.5px) 0 0/16px 16px,#F3E4C6;padding:11px;border-radius:4px}
.stamp-in{background:#F6EAD0;border:1.5px solid currentColor;outline:1px solid currentColor;outline-offset:-6px;padding:12px;display:flex;flex-direction:column;gap:6px;font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.st-top{display:flex;justify-content:space-between;align-items:baseline;font:700 11px/1.2 "Anek Latin",system-ui,sans-serif;letter-spacing:.08em}
.st-val{font:900 22px/1 "Playfair Display",Georgia,serif}
.st-name{font-weight:900;line-height:.92;letter-spacing:-0.01em;text-align:center}
.st-art{position:relative;border:1px solid currentColor}
.st-art svg{display:block;width:100%;height:auto}
.st-post{position:absolute;right:6px;top:6px;width:64px;height:64px;border:2px solid;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 8px/1.2 "Anek Latin",system-ui,sans-serif;letter-spacing:.06em;transform:rotate(-12deg);background:rgba(246,234,208,.55)}
.st-post b{font-size:13px}
.st-foot{display:flex;justify-content:space-between;gap:8px;font:700 10px/1.3 "Anek Latin",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-top:1px solid currentColor;padding-top:6px}
.pstage{max-width:360px !important;height:500px !important}
.pfront .st-art{flex:1;min-height:0;display:flex}
.pfront .st-art svg{width:100%;height:100%}

.pfront .stamp{height:100%;box-sizing:border-box;display:flex}
.pfront .stamp-in{flex:1}
.hero-stamps{margin-top:8px;width:100%}

.fback{height:100%;box-sizing:border-box;background:#2B3A6B;padding:14px;display:flex;flex-direction:column;gap:10px;color:#F4EAD5}
.fb-top,.fb-cap{display:flex;justify-content:space-between;font:800 12px/1 "Anek Latin",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.fb-cap{justify-content:center;font-size:13px}
.fgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:7px;min-height:0}
.fs{background:radial-gradient(circle,#2B3A6B 2.3px,transparent 2.7px) 0 0/8px 8px,var(--c);padding:5px;border-radius:2px;position:relative}
.fs-in{background:var(--c);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;text-align:center}
.fs-in svg{width:78%;height:auto;flex:1;min-height:0}
.fs-n{position:absolute;left:3px;top:1px;font:800 9px/1 "Anek Latin",system-ui,sans-serif;opacity:.85}
.fs-l{font:800 11px/1.05 "Anek Latin",system-ui,sans-serif}
.fs-e{font:700 8px/1 "Anek Latin",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.85}

.tk-row{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding-top:44px}
.tk{width:230px;display:flex;flex-direction:column;filter:drop-shadow(0 14px 24px rgba(18,38,44,.16))}
.tk-top{background:var(--a);border-radius:16px 16px 0 0;padding:64px 16px 14px;position:relative;display:flex;flex-direction:column;gap:10px}
.tk-food{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:160px}
.tk-food svg{display:block;width:100%;height:auto}
.tk-name{font:900 36px/1 "Playfair Display",Georgia,serif;color:#12262C}
.tk-pat{height:120px;border-radius:10px;border:2px solid #12262C;background:radial-gradient(circle,#FFFFFF 2.5px,transparent 3px) 0 0/20px 20px,radial-gradient(circle,var(--d) 6px,transparent 6.5px) 10px 10px/20px 20px,var(--a)}
.tk-perf{height:14px;background:radial-gradient(circle,#FBF1E4 4.5px,transparent 5px) 0 50%/20px 14px repeat-x,var(--c)}
.tk-stub{background:var(--c);border-radius:0 0 16px 16px;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.tk-bar{height:30px;background:repeating-linear-gradient(90deg,#12262C 0 2px,transparent 2px 4px,#12262C 4px 5px,transparent 5px 8px,#12262C 8px 11px,transparent 11px 13px)}
.tk-meta{display:flex;justify-content:space-between;font:800 12px/1 "Anek Latin",system-ui,sans-serif;color:#12262C;letter-spacing:.04em}


.th-stage{position:relative;min-height:340px}
.th-panel{display:none;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;border-radius:28px;padding:clamp(26px,4vw,44px);min-height:340px;box-sizing:border-box;position:relative;overflow:hidden;animation:thIn .6s ease both}
.th-panel.active{display:grid}
.th-panel::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(233,180,76,.22),transparent 60%),radial-gradient(ellipse at 10% 110%,rgba(200,85,61,.18),transparent 55%);pointer-events:none}
.th-panel > *{position:relative}
@keyframes thIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.th-tag{font:800 13px/1 "Anek Latin",system-ui,sans-serif;letter-spacing:.14em}
.th-h{margin:10px 0 14px;font:800 clamp(26px,3.2vw,38px)/1.1 "Playfair Display",Georgia,serif}
.th-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font:500 17px/1.4 "Anek Latin",system-ui,sans-serif}
.th-art{display:flex;justify-content:center}
.th-modern{background:linear-gradient(135deg,#1A120B,#3A2414);color:#F4E3C2;border:1px solid #5A3F22}.th-modern .th-tag{color:#E9B44C}
.th-temple{background:linear-gradient(135deg,#21140B,#4A2A16);color:#F4E3C2;border:1px solid #5A3F22}.th-temple .th-tag{color:#E9B44C}
.th-cafe{background:linear-gradient(135deg,#1C140C,#3C2A18);color:#F4E3C2;border:1px solid #5A3F22}.th-cafe .th-tag{color:#E9B44C}
.th-pub{background:linear-gradient(135deg,#0B0806,#24160B);color:#F4E3C2;border:1px solid #5A3F22}.th-pub .th-tag{color:#E9B44C}
.th-switch{display:flex;flex-wrap:wrap;gap:10px}
.th-btn{border:1.5px solid #B8862B;background:#FFFFFF;color:#6B4A14;font:700 15px/1 "Anek Latin",system-ui,sans-serif;padding:12px 18px;min-height:44px;border-radius:999px;cursor:pointer}
.th-btn[aria-selected="true"]{background:#1A120B;color:#E9B44C;border-color:#1A120B}
.th-step{background:#FFFFFF;border:1px solid #E7D6BA;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;font-weight:700;color:#12262C}
.th-step b{width:34px;height:34px;border-radius:50%;background:#E9B44C;color:#1A120B;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:760px){.th-panel{grid-template-columns:1fr}.th-art{order:-1}}
.pcar{display:flex;flex-direction:column;align-items:center;gap:14px}
.pstage{position:relative;width:100%;max-width:340px;height:460px;perspective:1200px}
.pslide{position:absolute;inset:0;opacity:0;animation:pShow 20s linear infinite}
.pflip{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.pslide:hover .pflip,.pslide:focus-within .pflip,.pslide:active .pflip{transform:rotateY(180deg)}
.pface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;overflow:hidden}
.pfront article{height:100%;box-sizing:border-box}
.pback{transform:rotateY(180deg)}
.pback article,.pback div[style*="aspect-ratio"] > div{min-height:0 !important;height:100% !important;width:100% !important;box-sizing:border-box}
.pstage:hover .pslide,.pstage:focus-within .pslide{animation-play-state:paused}
.pdots{display:flex;gap:8px}
.pdot{width:10px;height:10px;border-radius:50%;background:#C8553D;opacity:.25;animation:pDot 20s linear infinite}
.pnote{margin:0;color:#4D6168;font-size:15px;text-align:center}
@keyframes pShow{0%{opacity:0;visibility:hidden}1.5%{opacity:1;visibility:visible}18.5%{opacity:1;visibility:visible}20%{opacity:0;visibility:hidden}100%{opacity:0;visibility:hidden}}
@keyframes pDot{0%{opacity:.25}1.5%{opacity:1}18.5%{opacity:1}20%{opacity:.25}100%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pslide{animation:none;opacity:0}.pslide:first-child{opacity:1}.pdot{animation:none}}
